name: SmartQueue CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Build .NET Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build QueueApi
        run: |
          dotnet restore backend/QueueApi/QueueApi.csproj
          dotnet build backend/QueueApi/QueueApi.csproj --no-restore --configuration Release

      - name: Restore and build ProfileApi
        run: |
          dotnet restore backend/ProfileApi/ProfileApi.csproj
          dotnet build backend/ProfileApi/ProfileApi.csproj --no-restore --configuration Release

      - name: Restore and build NotificationWorker
        run: |
          dotnet restore backend/NotificationWorker/NotificationWorker.csproj
          dotnet build backend/NotificationWorker/NotificationWorker.csproj --no-restore --configuration Release

  frontend:
    name: Build Next.js
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
